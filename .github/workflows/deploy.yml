name: Deploy SCIM Application to HostForge

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to HostForge
        run: |
          echo "Deploying SCIM application to HostForge..."
          echo "This triggers HostForge's automatic deployment from main branch"
          echo "✓ Deployment trigger sent to HostForge"

      - name: Deployment Summary
        run: |
          echo "🚀 SCIM Application Deployment Complete"
          echo "=========================================="
          echo "Single Dockerfile deployment with microservices routing:"
          echo "  - /api/auth → auth-service"
          echo "  - /api/warehouse → warehouse-service"
          echo "  - /api/inventory → inventory-service"
          echo "  - / → frontend (SPA)"
          echo "=========================================="